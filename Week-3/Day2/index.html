<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Day 2: Smart Expense Tracker - Day 2</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="app-header">
        <h1>Expense Tracker</h1>
        <h2 id="total-balance">Total: $0.00</h2>
    </header>

    <main class="app-main">
        
        <section class="input-section">
            <form id="expense-form">
                <input type="text" id="expense-name" placeholder="Expense Name" required>
                <div class="input-row">
                    <input type="number" id="expense-amount" placeholder="Amount" step="0.01" required>
                    <select id="expense-category">
                        <option value="General">General</option>
                        <option value="Food">Food</option>
                        <option value="Software">Software</option>
                    </select>
                </div>
                <button type="submit">Add Expense</button>
            </form>
        </section>

        <section class="list-section">
            <ul id="expense-list">
                </ul>
        </section>

    </main>

    <footer class="app-footer">
        <p>&copy; 2026 Toseef Ali Danish. All rights reserved.</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
